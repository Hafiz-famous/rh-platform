{% extends "base.html" %}
{% block title %}Mot de passe oublié{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:560px;">
  <h3 class="mb-3">Mot de passe oublié</h3>
  <p class="text-muted">Saisis ton e-mail, on t’envoie un lien de réinitialisation (valide 1 heure).</p>

  <form method="post" class="vstack gap-3">
    {% if csrf_token is defined %}
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% endif %}
    <div>
      <label class="form-label" for="email">Email</label>
      <input id="email" type="email" name="email" class="form-control" required autocomplete="username" placeholder="ex: nom@domaine.com">
    </div>
    <button class="btn btn-primary w-100" type="submit">Envoyer le lien</button>
  </form>

  <div class="mt-3">
    <a href="{{ url_for('auth.login') }}" class="small">↩︎ Retour à la connexion</a>
  </div>
</div>
{% endblock %}
