{% extends "base.html" %}
{% block title %}Réinitialiser le mot de passe{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:560px;">
  <h3 class="mb-3">Nouveau mot de passe</h3>
  <p class="text-muted">Choisis un mot de passe d’au moins 8 caractères.</p>

  <form method="post" class="vstack gap-3">
    {% if csrf_token is defined %}
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% endif %}

    <div>
      <label class="form-label" for="pwd1">Nouveau mot de passe</label>
      <div class="input-group">
        <input id="pwd1" type="password" name="password" class="form-control" minlength="8" required autocomplete="new-password" placeholder="••••••••">
        <button type="button" class="btn btn-outline-secondary" onclick="toggle('pwd1')" aria-label="Afficher/masquer">👁</button>
      </div>
    </div>

    <div>
      <label class="form-label" for="pwd2">Confirmer le mot de passe</label>
      <div class="input-group">
        <input id="pwd2" type="password" name="password2" class="form-control" minlength="8" required autocomplete="new-password" placeholder="••••••••">
        <button type="button" class="btn btn-outline-secondary" onclick="toggle('pwd2')" aria-label="Afficher/masquer">👁</button>
      </div>
    </div>

    <button class="btn btn-success w-100" type="submit">Mettre à jour</button>
  </form>

  <div class="mt-3">
    <a href="{{ url_for('auth.login') }}" class="small">↩︎ Retour à la connexion</a>
  </div>
</div>

<script>
function toggle(id){
  const i = document.getElementById(id);
  if (!i) return;
  i.type = i.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
